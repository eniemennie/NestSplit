name: nestsplit_app
description: NestSplit - Split the Bill, Share the Load. A chores-first app for housemates, with a landlord companion view.
publish_to: 'none'
version: 0.3.1+4

environment:
  sdk: '>=3.0.0 <4.0.0'

# Only Flutter itself is used on purpose: no third-party packages to break.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Only used once to generate the phone launcher icon (dart run flutter_launcher_icons).
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo.png
  # Android adaptive icon: solid blue behind the house so there is no white margin.
  adaptive_icon_background: "#75B6E7"
  adaptive_icon_foreground: assets/images/logo_foreground.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  # To use the mockup's typeface, add the font files under assets/fonts and
  # uncomment the block below, then set AppText.fontFamily to the same name.
  # fonts:
  #   - family: NestSans
  #     fonts:
  #       - asset: assets/fonts/NestSans-Regular.ttf
  #       - asset: assets/fonts/NestSans-Bold.ttf
  #         weight: 700
